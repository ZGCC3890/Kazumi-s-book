appId: com.zgcc.kazumisbook
---
- launchApp
- extendedWaitUntil:
    visible: "热门番组"
    timeout: 10000
- tapOn:
    point: "50%,50%"
    text: "(?s).*我的.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "设置"
    waitToSettleTimeoutMs: 100
- scrollUntilVisible:
    element: "(?s).*同步设置.*"
    direction: DOWN
- tapOn:
    point: "50%,50%"
    text: "(?s).*同步设置.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "设置 WebDAV"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "(?s).*连接你的云盘.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "服务器地址"
    waitToSettleTimeoutMs: 100
- inputText: "http://10.0.2.2:8765/dav"
- tapOn:
    point: "50%,50%"
    text: "用户名"
    waitToSettleTimeoutMs: 100
- inputText: "fixture"
- tapOn:
    point: "50%,50%"
    text: "密码或应用授权码"
    waitToSettleTimeoutMs: 100
- inputText: "fixture"
- hideKeyboard
- scrollUntilVisible:
    element: "保存并测试"
    direction: DOWN
- tapOn:
    point: "50%,50%"
    text: "保存并测试"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "连接成功，配置已保存"
    timeout: 15000
- tapOn:
    point: "50%,50%"
    text: "返回同步设置"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "(?s).*启用 WebDAV.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "(?s).*小说阅读进度与书签.*"
    waitToSettleTimeoutMs: 100
- runFlow:
    when:
      true: ${LEGACY == 'false'}
    commands:
      - runFlow:
          when:
            true: ${LAYOUT == 'tablet'}
          commands:
            - swipe:
                from:
                  text: "(?s).*小说阅读进度与书签.*"
                direction: UP
      - scrollUntilVisible:
          element: "立即同步小说"
          direction: DOWN
          timeout: 2000
      - tapOn:
          text: "立即同步小说"
          waitToSettleTimeoutMs: 100
      - scrollUntilVisible:
          element: "(?s)^小说阅读进度与书签已同步.*$"
          direction: DOWN
          timeout: 15000
- takeScreenshot: build/android-ui/novel-sync-enabled
