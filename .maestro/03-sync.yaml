appId: com.zgcc.kazumisbook
---
- launchApp
- extendedWaitUntil:
    visible: "热门番组"
    timeout: 60000
- tapOn: "(?s).*我的.*"
- tapOn: "设置"
- scrollUntilVisible:
    element: "(?s).*同步设置.*"
    direction: DOWN
- tapOn: "(?s).*同步设置.*"
- tapOn: "设置 WebDAV"
- tapOn: "(?s).*连接你的云盘.*"
- tapOn: "服务器地址"
- inputText: "http://10.0.2.2:8765/dav"
- tapOn: "用户名"
- inputText: "fixture"
- tapOn: "密码或应用授权码"
- inputText: "fixture"
- hideKeyboard
- scrollUntilVisible:
    element: "保存并测试"
    direction: DOWN
- tapOn: "保存并测试"
- extendedWaitUntil:
    visible: "连接成功，配置已保存"
    timeout: 30000
- tapOn: "返回同步设置"
- tapOn: "(?s).*启用 WebDAV.*"
- tapOn: "(?s).*小说阅读进度与书签.*"
- runFlow:
    when:
      true: ${LEGACY == 'false'}
    commands:
      - runFlow:
          when:
            true: ${LAYOUT == 'tablet'}
          commands:
            - swipe:
                from:
                  text: "(?s).*小说阅读进度与书签.*"
                direction: UP
      - extendedWaitUntil:
          visible: "小说阅读进度与书签已同步"
          timeout: 60000
- takeScreenshot: build/android-ui/novel-sync-enabled
