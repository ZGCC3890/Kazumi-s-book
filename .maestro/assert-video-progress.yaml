appId: com.zgcc.kazumisbook
---
- runFlow:
    when:
      true: ${LAYOUT == 'phone'}
    commands:
      - extendedWaitUntil:
          visible: "(?s).*(?:00:(?:0[1-9]|[1-5][0-9])|01:[0-5][0-9]) / 02:00.*"
          timeout: 10000
- runFlow:
    when:
      true: ${LAYOUT == 'tablet'}
    commands:
      # The library paints tablet clocks without updating its percentage
      # semantics. Sample actual video pixels with all controls hidden.
      - runFlow:
          when:
            visible: "暂停"
          commands:
            - tapOn:
                point: "50%,50%"
                waitToSettleTimeoutMs: 100
      - extendedWaitUntil:
          notVisible: "暂停"
          timeout: 2000
      - runScript: scripts/video-frames.js
      - tapOn:
          point: "50%,50%"
          waitToSettleTimeoutMs: 100
      - extendedWaitUntil:
          visible: "暂停"
          timeout: 2000
