appId: com.zgcc.kazumisbook
---
- runFlow:
    when:
      true: ${LAYOUT == 'phone'}
    commands:
      - extendedWaitUntil:
          visible: "(?s).*(?:00:(?:0[1-9]|[1-5][0-9])|01:[0-5][0-9]) / 02:00.*"
          timeout: 15000
- runFlow:
    when:
      true: ${LAYOUT == 'tablet'}
    commands:
      - extendedWaitUntil:
          visible: "^(?:[1-9]|[1-9][0-9])%, Progress bar$"
          timeout: 15000
