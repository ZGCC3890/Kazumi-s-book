appId: com.zgcc.kazumisbook
env:
  LEGACY: "true"
---
# The released 0.1.1 rail omits navigation semantics in landscape. Prepare
# its upgrade data in portrait; upgrade-check and main test the new layout.
- setOrientation: PORTRAIT
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "同意并继续"
    timeout: 10000
- tapOn:
    point: "50%,50%"
    text: "同意并继续"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "继续"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "继续"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "开始使用"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "仍然继续"
    waitToSettleTimeoutMs: 100
# The baseline release checks the newer published version on first launch.
- extendedWaitUntil:
    visible: "(?s)^发现新版本(?:\\n.*)?$"
    timeout: 10000
- tapOn:
    text: "不再自动检查"
    waitToSettleTimeoutMs: 100
- tapOn:
    text: "稍后"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "热门番组"
    timeout: 10000
- tapOn:
    point: "50%,50%"
    text: "(?s).*追番.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "(?s).*书架.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "小说规则"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "添加规则"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "(?s).*从剪贴板导入.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "规则内容"
    waitToSettleTimeoutMs: 100
- inputText: "http://10.0.2.2:8765/novels/rules.json"
- hideKeyboard
- tapOn:
    point: "50%,50%"
    waitToSettleTimeoutMs: 100
    text: "导入规则"
    index: 1
- extendedWaitUntil:
    visible: "(?s).*Fixture Source A.*"
    timeout: 2000
# Let the four-second import snackbar finish before it follows navigation
# onto the bookshelf and shifts the search FAB during its tap.
- extendedWaitUntil:
    notVisible: "已导入 2 条小说规则"
    timeout: 5000
- back
- tapOn:
    point: "50%,50%"
    text: "(?s).*追番.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "(?s).*书架.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "搜索小说"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "书名"
    timeout: 2000
- tapOn:
    point: "50%,50%"
    text: "书名"
    waitToSettleTimeoutMs: 100
- inputText: "Fixture"
- tapOn:
    point: "50%,50%"
    text: "搜索"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "(?s).*Author A.*"
    timeout: 2000
- tapOn:
    point: "50%,50%"
    text: "(?s).*Author A.*"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "Got it"
    timeout: 2000
- tapOn:
    point: "50%,50%"
    text: "Got it"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: ".*Chapter 1 opening.*"
    timeout: 2000
- tapOn:
    point: "50%,50%"
    text: ".*Chapter 1 opening.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "添加书签"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "备注（可留空）"
    waitToSettleTimeoutMs: 100
- inputText: "LegacyBookmark1"
- hideKeyboard
- tapOn:
    point: "50%,50%"
    text: "保存"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "目录"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "(?s).*Chapter 2.*"
    waitToSettleTimeoutMs: 100
- assertVisible: ".*Chapter 2 opening.*"
- tapOn:
    point: "50%,50%"
    text: ".*Chapter 2 opening.*"
    waitToSettleTimeoutMs: 100
- swipe:
    start: "50%,80%"
    end: "50%,30%"
    duration: 600
- tapOn:
    waitToSettleTimeoutMs: 100
    point: "50%,50%"
- tapOn:
    point: "50%,50%"
    text: "添加书签"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "备注（可留空）"
    waitToSettleTimeoutMs: 100
- inputText: "LegacyBookmark2"
- hideKeyboard
- tapOn:
    point: "50%,50%"
    text: "保存"
    waitToSettleTimeoutMs: 100
- takeScreenshot: build/android-ui/upgrade-old-reader
- tapOn:
    point: "50%,50%"
    text: "返回"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "加入书架"
    waitToSettleTimeoutMs: 100
- back
- runFlow: 03-sync.yaml
- launchApp
- extendedWaitUntil:
    visible: "热门番组"
    timeout: 10000
- tapOn:
    point: "50%,50%"
    text: "(?s).*追番.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "(?s).*书架.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "同步小说"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible:
      text: "同步小说"
      enabled: true
    timeout: 15000
- takeScreenshot: build/android-ui/upgrade-old-shelf
