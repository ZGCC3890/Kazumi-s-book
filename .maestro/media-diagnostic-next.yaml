appId: com.zgcc.kazumisbook
env:
  LAYOUT: "phone"
---
- runFlow:
    when:
      notVisible: "暂停"
    commands:
      - tapOn:
          point: "50%,25%"
          waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "暂停"
    timeout: 2000
- tapOn:
    point: "50%,50%"
    text: "全屏"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "下一集"
    timeout: 2000
- tapOn:
    point: "50%,50%"
    text: "下一集"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: ".*Episode 2.*"
    timeout: 10000
- runFlow: assert-video-progress.yaml
- takeScreenshot: build/media-diagnostic/episode-two-fullscreen
- back
- assertVisible: "Episode 2，正在播放"
