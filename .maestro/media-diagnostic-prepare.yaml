appId: com.zgcc.kazumisbook
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "同意并继续"
    timeout: 60000
- tapOn: "同意并继续"
- tapOn: "继续"
- tapOn: "继续"
- tapOn: "开始使用"
- tapOn: "仍然继续"
- extendedWaitUntil:
    visible: "热门番组"
    timeout: 60000
- tapOn: "(?s).*我的.*"
- tapOn: "设置"
- tapOn: "(?s).*规则管理.*"
- tapOn: "添加规则"
- tapOn: "(?s).*从文件导入.*"
- runFlow:
    when:
      visible: "Show roots"
    commands:
      - tapOn: "Show roots"
- tapOn: "Downloads"
- tapOn: "book-test-video.json"
- extendedWaitUntil:
    visible: "(?s).*Fixture Video.*"
    timeout: 30000
