appId: com.zgcc.kazumisbook
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "同意并继续"
    timeout: 10000
- tapOn:
    point: "50%,50%"
    text: "同意并继续"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "继续"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "继续"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "开始使用"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "仍然继续"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "热门番组"
    timeout: 10000
- tapOn:
    point: "50%,50%"
    text: "(?s).*我的.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "设置"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "(?s).*规则管理.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "添加规则"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "(?s).*从文件导入.*"
    waitToSettleTimeoutMs: 100
- runFlow:
    when:
      visible: "Show roots"
    commands:
      - tapOn:
          point: "50%,50%"
          text: "Show roots"
          waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "Downloads"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "book-test-video.json"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "(?s).*Fixture Video.*"
    timeout: 2000
