appId: com.zgcc.kazumisbook
env:
  LEGACY: "false"
---
# Independent novel operations. Full live integration remains in main.yaml.
- runFlow: set-layout.yaml
- runFlow: 01-navigation.yaml
- runFlow: 02-reader.yaml
- runFlow: 03-sync.yaml
- runFlow: 05-change-source.yaml
- tapOn:
    point: "50%,50%"
    text: "(?s).*同步小说.*"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible:
      text: "(?s).*同步小说.*"
      enabled: true
    timeout: 15000
- takeScreenshot: build/android-ui/bookshelf-final-sync
