appId: com.zgcc.kazumisbook
---
- runFlow: 05-change-source.yaml
- tapOn:
    point: "50%,50%"
    text: "查看番剧详情"
    waitToSettleTimeoutMs: 100
- assertVisible: "选择番剧"
- tapOn:
    point: "50%,50%"
    text: ".*芙莉莲.*2023"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "开始观看"
    timeout: 15000
- takeScreenshot: build/android-ui/novel-to-anime-details
- tapOn:
    point: "50%,50%"
    text: "阅读轻小说"
    waitToSettleTimeoutMs: 100
- assertVisible: "小说搜索"
- extendedWaitUntil:
    visible:
      id: ".*novel-search-result-0.*"
    timeout: 2000
- tapOn:
    id: ".*novel-search-result-0.*"
    waitToSettleTimeoutMs: 100
- assertVisible: "小说详情"
- tapOn:
    text: "选择书源阅读"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "(?s).*Author B.*"
    timeout: 2000
- tapOn:
    point: "50%,50%"
    text: "(?s).*Author B.*"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: ".*Chapter 2 opening.*"
    timeout: 2000
- takeScreenshot: build/android-ui/anime-to-novel-restored
- back
- back
- tapOn:
    point: "50%,50%"
    text: "同步小说"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible:
      text: "同步小说"
      enabled: true
    timeout: 15000
- takeScreenshot: build/android-ui/bookshelf-final-sync
