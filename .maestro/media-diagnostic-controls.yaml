appId: com.zgcc.kazumisbook
env:
  LAYOUT: "phone"
---
- runFlow:
    when:
      notVisible: "暂停"
    commands:
      - tapOn:
          point: "50%,25%"
          waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "暂停"
    timeout: 2000
- runFlow: enter-first-fullscreen.yaml
- tapOn:
    text: "暂停"
    waitToSettleTimeoutMs: 100
- assertVisible: "播放"
- takeScreenshot: build/media-diagnostic/video-paused
- back
- assertVisible: "Episode 1，正在播放"
- assertVisible: "播放"
