appId: com.zgcc.kazumisbook
---
- tapOn:
    point: "50%,50%"
    text: "全屏"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "Got it"
    waitToSettleTimeoutMs: 100
- runFlow:
    when:
      notVisible: "暂停"
    commands:
      - tapOn:
          point: "50%,50%"
          waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "下一集"
    timeout: 2000
