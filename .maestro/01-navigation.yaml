appId: com.zgcc.kazumisbook
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "同意并继续"
    timeout: 10000
- tapOn:
    point: "50%,50%"
    text: "同意并继续"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "继续"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "继续"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "开始使用"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "仍然继续"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "热门番组"
    timeout: 10000
- takeScreenshot: build/android-ui/home
- tapOn:
    point: "50%,50%"
    text: "搜索"
    waitToSettleTimeoutMs: 100
- assertVisible: "番剧搜索"
# The same live search and result assertions run once in 04-video, after
# the owned novel fixtures, alongside the real comments/playback entry.
- tapOn:
    point: "50%,50%"
    text: "番剧"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "小说"
    waitToSettleTimeoutMs: 100
- assertVisible: "小说搜索"
- assertVisible: "搜索小说书名"
- tapOn:
    point: "50%,50%"
    text: "小说规则"
    waitToSettleTimeoutMs: 100
- assertVisible: "我的规则"
- tapOn:
    point: "50%,50%"
    text: "添加规则"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "(?s).*从剪贴板导入.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "规则内容"
    waitToSettleTimeoutMs: 100
- inputText: "http://10.0.2.2:8765/novels/rules.json"
- hideKeyboard
- tapOn:
    point: "50%,50%"
    waitToSettleTimeoutMs: 100
    text: "导入规则"
    index: 1
- assertVisible: "(?s).*Fixture Source A.*"
- assertVisible: "(?s).*Fixture Source C.*"
# The import snackbar moves the FAB by 48 px. Wait until its transition and
# display end before Maestro captures the next button's screen coordinates.
# Flutter's actual snackbar display duration is 4 seconds.
- extendedWaitUntil:
    notVisible: "已导入 2 条小说规则"
    timeout: 5000
- tapOn:
    point: "50%,50%"
    text: "添加规则"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "(?s).*浏览规则仓库.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "规则仓库设置"
    waitToSettleTimeoutMs: 100
- longPressOn: "规则仓库地址"
- tapOn:
    point: "50%,50%"
    text: "全选"
    waitToSettleTimeoutMs: 100
- eraseText: 1
- inputText: "http://10.0.2.2:8765/novels/catalog.json"
- assertVisible: 'http://10\.0\.2\.2:8765/novels/catalog\.json'
- hideKeyboard
- tapOn:
    point: "50%,50%"
    text: "保存"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "(?s).*Fixture Source B.*"
    timeout: 2000
- tapOn:
    point: "50%,50%"
    text: "安装"
    waitToSettleTimeoutMs: 100
- assertVisible: "重新获取"
- tapOn:
    point: "50%,50%"
    text: "重新获取"
    waitToSettleTimeoutMs: 100
- assertVisible: "重新获取"
- back
- assertVisible: "(?s).*Fixture Source B.*"
- tapOn:
    point: "50%,50%"
    text: "管理Fixture Source C"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "复制规则链接"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "管理Fixture Source C"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "删除规则"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "保留"
    waitToSettleTimeoutMs: 100
- assertVisible: "(?s).*Fixture Source C.*"
- tapOn:
    point: "50%,50%"
    text: "管理Fixture Source C"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "删除规则"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "删除"
    waitToSettleTimeoutMs: 100
- assertNotVisible: "(?s).*Fixture Source C.*"
# After the copy snackbar exits, Flutter reports this FAB 48 px above its
# painted hit target (confirmed on both fixed test viewports). Use the visible
# button's centre, not the stale accessibility bounds, and verify the dialog.
- tapOn:
    point: "${LAYOUT == 'tablet' ? '94%,87%' : '84%,92%'}"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "(?s).*从剪贴板导入.*"
    timeout: 2000
- tapOn:
    point: "50%,50%"
    text: "(?s).*从剪贴板导入.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    waitToSettleTimeoutMs: 100
    text: "导入规则"
    index: 1
- assertVisible: "(?s).*Fixture Source C.*"
- takeScreenshot: build/android-ui/installed-novel-rules
- back
- tapOn:
    point: "50%,50%"
    text: "搜索小说书名"
    waitToSettleTimeoutMs: 100
- inputText: "Fixture"
- tapOn:
    point: "50%,50%"
    text: "搜索"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "(?s).*葬送的芙莉莲.*"
    timeout: 2000
- takeScreenshot: build/android-ui/novel-search
- back
- tapOn:
    point: "50%,50%"
    text: "(?s).*追番.*"
    waitToSettleTimeoutMs: 100
- assertVisible: "(?s)^书架(?:\\n.*)?$"
- tapOn:
    point: "50%,50%"
    text: "(?s).*书架.*"
    waitToSettleTimeoutMs: 100
- assertVisible: "搜索小说"
- takeScreenshot: build/android-ui/bookshelf
- tapOn:
    point: "50%,50%"
    text: "(?s).*我的.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "设置"
    waitToSettleTimeoutMs: 100
- assertVisible: '(?s)^播放设置(?:\n.*)?$'
- takeScreenshot: build/android-ui/settings
- tapOn:
    point: "50%,50%"
    text: "(?s).*播放设置.*"
    waitToSettleTimeoutMs: 100
- assertVisible: "播放设置"
- runFlow: back-to-settings.yaml
- tapOn:
    point: "50%,50%"
    text: "(?s).*弹幕设置.*"
    waitToSettleTimeoutMs: 100
- assertVisible: "弹幕设置"
- runFlow: back-to-settings.yaml
- tapOn:
    point: "50%,50%"
    text: "(?s).*操作设置.*"
    waitToSettleTimeoutMs: 100
- assertVisible: "操作设置"
- runFlow: back-to-settings.yaml
- tapOn:
    point: "50%,50%"
    text: "(?s).*规则管理.*"
    waitToSettleTimeoutMs: 100
- assertVisible: "添加规则"
- runFlow: back-to-settings.yaml
- tapOn:
    point: "50%,50%"
    text: "(?s).*下载设置.*"
    waitToSettleTimeoutMs: 100
- assertVisible: "下载设置"
- runFlow: back-to-settings.yaml
- scrollUntilVisible:
    element: "(?s).*外观设置.*"
    direction: DOWN
- tapOn:
    point: "50%,50%"
    text: "(?s).*外观设置.*"
    waitToSettleTimeoutMs: 100
- assertVisible: "外观设置"
- tapOn:
    point: "50%,50%"
    text: "(?s).*深色模式.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "深色"
    waitToSettleTimeoutMs: 100
- takeScreenshot: build/android-ui/theme-settings
- runFlow: back-to-settings.yaml
- scrollUntilVisible:
    element: "(?s).*界面设置.*"
    direction: DOWN
- tapOn:
    point: "50%,50%"
    text: "(?s).*界面设置.*"
    waitToSettleTimeoutMs: 100
- assertVisible: "界面设置"
- runFlow: back-to-settings.yaml
- scrollUntilVisible:
    element: "(?s).*同步设置.*"
    direction: DOWN
- tapOn:
    point: "50%,50%"
    text: "(?s).*同步设置.*"
    waitToSettleTimeoutMs: 100
- assertVisible: "WebDAV"
- takeScreenshot: build/android-ui/sync-settings
- runFlow: back-to-settings.yaml
- scrollUntilVisible:
    element: "(?s).*网络设置.*"
    direction: DOWN
- tapOn:
    point: "50%,50%"
    text: "(?s).*网络设置.*"
    waitToSettleTimeoutMs: 100
- assertVisible: "网络设置"
- runFlow: back-to-settings.yaml
- runFlow:
    when:
      true: ${LAYOUT == 'tablet'}
    commands:
      - swipe:
          from:
            text: "界面设置"
          direction: UP
- scrollUntilVisible:
    element: "(?s).*更新设置.*"
    direction: DOWN
- tapOn:
    point: "50%,50%"
    text: "(?s).*更新设置.*"
    waitToSettleTimeoutMs: 100
- assertVisible: "更新设置"
- runFlow: back-to-settings.yaml
- runFlow:
    when:
      true: ${LAYOUT == 'tablet'}
    commands:
      - swipe:
          from:
            text: "界面设置"
          direction: UP
- scrollUntilVisible:
    element: "(?s).*存储与日志.*"
    direction: DOWN
- tapOn:
    point: "50%,50%"
    text: "(?s).*存储与日志.*"
    waitToSettleTimeoutMs: 100
- assertVisible: "存储与日志"
- runFlow: back-to-settings.yaml
- runFlow:
    when:
      true: ${LAYOUT == 'tablet'}
    commands:
      - swipe:
          from:
            text: "界面设置"
          direction: UP
- scrollUntilVisible:
    element: "(?s).*关于.*"
    direction: DOWN
- tapOn:
    point: "50%,50%"
    text: "(?s).*关于.*"
    waitToSettleTimeoutMs: 100
- assertVisible: ".*Kazumi.*book.*"
- takeScreenshot: build/android-ui/about
