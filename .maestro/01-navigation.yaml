appId: com.zgcc.kazumisbook
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "同意并继续"
    timeout: 60000
- tapOn: "同意并继续"
- tapOn: "继续"
- tapOn: "继续"
- tapOn: "开始使用"
- tapOn: "仍然继续"
- extendedWaitUntil:
    visible: "热门番组"
    timeout: 60000
- takeScreenshot: build/android-ui/home
- tapOn: "搜索"
- assertVisible: "番剧搜索"
- tapOn: "搜索番剧名称"
- inputText: "Frieren"
- tapOn: "搜索"
- extendedWaitUntil:
    visible: ".*芙莉莲.*"
    timeout: 60000
- takeScreenshot: build/android-ui/anime-search
- tapOn: "番剧"
- tapOn: "小说"
- assertVisible: "小说搜索"
- assertVisible: "搜索小说书名"
- tapOn: "小说规则"
- assertVisible: "我的规则"
- tapOn: "添加规则"
- tapOn: "(?s).*从剪贴板导入.*"
- tapOn: "规则内容"
- inputText: "http://10.0.2.2:8765/novels/rules.json"
- hideKeyboard
- tapOn:
    text: "导入规则"
    index: 1
- assertVisible: "(?s).*Fixture Source A.*"
- assertVisible: "(?s).*Fixture Source C.*"
# The import snackbar moves the FAB by 48 px. Wait until its transition and
# display end before Maestro captures the next button's screen coordinates.
- extendedWaitUntil:
    notVisible: "已导入 2 条小说规则"
    timeout: 10000
- tapOn: "添加规则"
- tapOn: "(?s).*浏览规则仓库.*"
- tapOn: "规则仓库设置"
- tapOn: "规则仓库地址"
- eraseText: 200
- inputText: "http://10.0.2.2:8765/novels/catalog.json"
- hideKeyboard
- tapOn: "保存"
- extendedWaitUntil:
    visible: "(?s).*Fixture Source B.*"
    timeout: 30000
- tapOn: "安装"
- assertVisible: "重新获取"
- tapOn: "重新获取"
- assertVisible: "重新获取"
- back
- assertVisible: "(?s).*Fixture Source B.*"
- tapOn: "管理Fixture Source C"
- tapOn: "复制规则链接"
- tapOn: "管理Fixture Source C"
- tapOn: "删除规则"
- tapOn: "保留"
- assertVisible: "(?s).*Fixture Source C.*"
- tapOn: "管理Fixture Source C"
- tapOn: "删除规则"
- tapOn: "删除"
- assertNotVisible: "(?s).*Fixture Source C.*"
- tapOn: "添加规则"
- tapOn: "(?s).*从剪贴板导入.*"
- tapOn:
    text: "导入规则"
    index: 1
- assertVisible: "(?s).*Fixture Source C.*"
- takeScreenshot: build/android-ui/installed-novel-rules
- back
- tapOn: "搜索小说书名"
- inputText: "Fixture"
- tapOn: "搜索"
- extendedWaitUntil:
    visible: "(?s).*葬送的芙莉莲.*"
    timeout: 60000
- takeScreenshot: build/android-ui/novel-search
- back
- tapOn: "(?s).*追番.*"
- assertVisible: "书架"
- tapOn: "(?s).*书架.*"
- assertVisible: "搜索小说"
- takeScreenshot: build/android-ui/bookshelf
- tapOn: "(?s).*我的.*"
- tapOn: "设置"
- assertVisible: "播放设置"
- takeScreenshot: build/android-ui/settings
- tapOn: "(?s).*播放设置.*"
- assertVisible: "播放设置"
- runFlow: back-to-settings.yaml
- tapOn: "(?s).*弹幕设置.*"
- assertVisible: "弹幕设置"
- runFlow: back-to-settings.yaml
- tapOn: "(?s).*操作设置.*"
- assertVisible: "操作设置"
- runFlow: back-to-settings.yaml
- tapOn: "(?s).*规则管理.*"
- assertVisible: "添加规则"
- runFlow: back-to-settings.yaml
- tapOn: "(?s).*下载设置.*"
- assertVisible: "下载设置"
- runFlow: back-to-settings.yaml
- scrollUntilVisible:
    element: "(?s).*外观设置.*"
    direction: DOWN
- tapOn: "(?s).*外观设置.*"
- assertVisible: "外观设置"
- tapOn: "(?s).*深色模式.*"
- tapOn: "深色"
- takeScreenshot: build/android-ui/theme-settings
- runFlow: back-to-settings.yaml
- scrollUntilVisible:
    element: "(?s).*界面设置.*"
    direction: DOWN
- tapOn: "(?s).*界面设置.*"
- assertVisible: "界面设置"
- runFlow: back-to-settings.yaml
- scrollUntilVisible:
    element: "(?s).*同步设置.*"
    direction: DOWN
- tapOn: "(?s).*同步设置.*"
- assertVisible: "WebDAV"
- takeScreenshot: build/android-ui/sync-settings
- runFlow: back-to-settings.yaml
- scrollUntilVisible:
    element: "(?s).*网络设置.*"
    direction: DOWN
- tapOn: "(?s).*网络设置.*"
- assertVisible: "网络设置"
- runFlow: back-to-settings.yaml
- scrollUntilVisible:
    element: "(?s).*更新设置.*"
    direction: DOWN
- tapOn: "(?s).*更新设置.*"
- assertVisible: "更新设置"
- runFlow: back-to-settings.yaml
- scrollUntilVisible:
    element: "(?s).*存储与日志.*"
    direction: DOWN
- tapOn: "(?s).*存储与日志.*"
- assertVisible: "存储与日志"
- runFlow: back-to-settings.yaml
- scrollUntilVisible:
    element: "(?s).*关于.*"
    direction: DOWN
- tapOn: "(?s).*关于.*"
- assertVisible: ".*Kazumi.*book.*"
- takeScreenshot: build/android-ui/about
