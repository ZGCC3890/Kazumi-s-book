appId: com.zgcc.kazumisbook
---
- runFlow: set-layout.yaml
- launchApp
- extendedWaitUntil:
    visible: "热门番组"
    timeout: 10000
- assertNotVisible: "同意并继续"
- tapOn:
    point: "50%,50%"
    text: "(?s).*追番.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "(?s).*书架.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "(?s).*葬送的芙莉莲.*"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: ".*Chapter 2 paragraph.*"
    timeout: 2000
- tapOn:
    point: "50%,50%"
    waitToSettleTimeoutMs: 100
    text: ".*Chapter 2 paragraph.*"
    index: 0
- tapOn:
    point: "50%,50%"
    text: "书签"
    waitToSettleTimeoutMs: 100
- assertVisible: "(?s).*LegacyBookmark1.*"
- assertVisible: "(?s).*LegacyBookmark2.*"
- takeScreenshot: build/android-ui/upgrade-preserved-bookmarks
- back
- back
- tapOn:
    point: "50%,50%"
    text: "同步"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible:
      text: "同步"
      enabled: true
    timeout: 15000
- assertNotVisible: "(?s).*同步失败.*"
- takeScreenshot: build/android-ui/upgrade-flat-migration
