appId: com.zgcc.kazumisbook
---
- runFlow: set-layout.yaml
- launchApp
- extendedWaitUntil:
    visible: "热门番组"
    timeout: 60000
- assertNotVisible: "同意并继续"
- tapOn: "(?s).*追番.*"
- tapOn: "(?s).*书架.*"
- tapOn: "(?s).*葬送的芙莉莲.*"
- extendedWaitUntil:
    visible: ".*Chapter 2 paragraph.*"
    timeout: 30000
- tapOn:
    point: "50%,50%"
- tapOn: "书签"
- assertVisible: "(?s).*LegacyBookmark1.*"
- assertVisible: "(?s).*LegacyBookmark2.*"
- takeScreenshot: build/android-ui/upgrade-preserved-bookmarks
- back
- back
- tapOn: "同步小说"
- extendedWaitUntil:
    visible:
      text: "同步小说"
      enabled: true
    timeout: 60000
- assertNotVisible: "(?s).*同步失败.*"
- takeScreenshot: build/android-ui/upgrade-flat-migration
