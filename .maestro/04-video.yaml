appId: com.zgcc.kazumisbook
---
- launchApp
- extendedWaitUntil:
    visible: "热门番组"
    timeout: 10000
- tapOn:
    point: "50%,50%"
    text: "(?s).*我的.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "设置"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "(?s).*规则管理.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "添加规则"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "(?s).*从文件导入.*"
    waitToSettleTimeoutMs: 100
- runFlow:
    when:
      visible: "Show roots"
    commands:
      - tapOn:
          point: "50%,50%"
          text: "Show roots"
          waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "Downloads"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "book-test-video.json"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "(?s).*Fixture Video.*"
    timeout: 2000
- takeScreenshot: build/android-ui/video-rule-file-import
- tapOn:
    point: "50%,50%"
    text: "Fixture Video 的更多操作"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "测试规则"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "测试关键词"
    waitToSettleTimeoutMs: 100
- inputText: "Frieren"
- hideKeyboard
- tapOn:
    point: "50%,50%"
    text: "开始测试"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "(?s).*葬送的芙莉莲.*"
    timeout: 2000
- takeScreenshot: build/android-ui/video-rule-test
- back
- back
- runFlow:
    when:
      true: ${LAYOUT == 'phone'}
    commands:
      - back
- tapOn:
    point: "50%,50%"
    text: "(?s).*推荐.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "搜索"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "搜索番剧名称"
    waitToSettleTimeoutMs: 100
- inputText: "Frieren"
- tapOn:
    point: "50%,50%"
    text: "搜索"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "(?s).*芙莉莲.*"
    timeout: 15000
- takeScreenshot: build/android-ui/anime-search
- tapOn:
    point: "50%,50%"
    waitToSettleTimeoutMs: 100
    text: "(?s).*芙莉莲.*"
    index: 0
- extendedWaitUntil:
    visible: "开始观看"
    timeout: 15000
- tapOn:
    point: "50%,50%"
    text: "(?s).*吐槽.*"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible:
      id: ".*bangumi-comment.*"
    timeout: 15000
- assertNotVisible: "评论加载失败"
- takeScreenshot: build/android-ui/anime-comments
- tapOn:
    point: "50%,50%"
    text: "开始观看"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "(?s).*Fixture Video.*"
    timeout: 2000
- tapOn:
    point: "50%,50%"
    waitToSettleTimeoutMs: 100
    text: "(?s).*葬送的芙莉莲.*"
    index: 0
- extendedWaitUntil:
    notVisible: "视频资源解析中"
    timeout: 10000
- runFlow:
    when:
      notVisible: "暂停"
    commands:
      - tapOn:
          point: "50%,25%"
          waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "暂停"
    timeout: 2000
- runFlow: assert-video-progress.yaml
- runFlow:
    when:
      true: ${LAYOUT == 'phone'}
    commands:
      - runFlow: enter-fullscreen.yaml
- tapOn:
    point: "50%,50%"
    text: "暂停"
    waitToSettleTimeoutMs: 100
- assertVisible: "播放"
- takeScreenshot: build/android-ui/video-paused
# Match the verified diagnostic sequence: leave fullscreen while paused,
# resume in the compact player, then enter fullscreen for the next action.
# Keeping all three actions in one 4-second control window races auto-hide.
- runFlow:
    when:
      true: ${LAYOUT == 'phone'}
    commands:
      - back
      - assertVisible: "Episode 1，当前选集"
      - runFlow:
          when:
            notVisible: "播放"
          commands:
            - tapOn:
                point: "50%,25%"
                waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "播放"
    waitToSettleTimeoutMs: 100
- runFlow:
    when:
      true: ${LAYOUT == 'phone'}
    commands:
      - extendedWaitUntil:
          visible: "暂停"
          timeout: 2000
      - runFlow: enter-fullscreen.yaml
- tapOn:
    point: "50%,50%"
    text: "下一集"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: ".*Episode 2.*"
    timeout: 10000
- runFlow: assert-video-progress.yaml
- assertNotVisible: "暂时无法播放"
- takeScreenshot: build/android-ui/video-second-episode
- back
