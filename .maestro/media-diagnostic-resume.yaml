appId: com.zgcc.kazumisbook
---
- runFlow:
    when:
      notVisible: "播放"
    commands:
      - tapOn:
          point: "50%,25%"
          waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "播放"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "暂停"
    timeout: 2000
