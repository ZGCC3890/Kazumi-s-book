appId: com.zgcc.kazumisbook
---
- launchApp
- extendedWaitUntil:
    visible: "热门番组"
    timeout: 10000
- tapOn:
    point: "50%,50%"
    text: "搜索"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "番剧"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "小说"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "搜索小说书名"
    waitToSettleTimeoutMs: 100
- inputText: "Fixture"
- tapOn:
    point: "50%,50%"
    text: "搜索"
    waitToSettleTimeoutMs: 100
- scrollUntilVisible:
    element:
      id: ".*novel-read-fixture-a-.*"
    direction: DOWN
    timeout: 10000
- tapOn:
    point: "50%,50%"
    waitToSettleTimeoutMs: 100
    id: ".*novel-read-fixture-a-.*"
- extendedWaitUntil:
    visible: ".*Chapter 1 opening.*"
    timeout: 2000
- assertNotVisible: "阅读设置"
- takeScreenshot: build/android-ui/reader-hidden-controls
- tapOn:
    point: "50%,50%"
    text: "小说插图，点击放大"
    waitToSettleTimeoutMs: 100
- assertVisible: "关闭插图"
- takeScreenshot: build/android-ui/reader-illustration
- tapOn:
    point: "50%,50%"
    text: "关闭插图"
    waitToSettleTimeoutMs: 100
# Compare text anchors after scrolling past the leading illustration.
- swipe:
    start: "50%,70%"
    end: "50%,20%"
    duration: 600
- swipe:
    start: "50%,70%"
    end: "50%,20%"
    duration: 600
- swipe:
    start: "2%,80%"
    end: "2%,30%"
    duration: 600
- tapOn:
    waitToSettleTimeoutMs: 100
    point: "50%,50%"
- assertVisible: "阅读设置"
- tapOn: {text: "显示插图栏", waitToSettleTimeoutMs: 100}
- assertVisible: "本卷插图 1，点击放大"
- takeScreenshot: build/android-ui/reader-gallery-strip
- swipe: {from: {id: ".*novel-illustration-strip.*", point: "85%,50%"}, direction: LEFT, duration: 400, waitToSettleTimeoutMs: 100}
- swipe: {from: {id: ".*novel-illustration-strip.*", point: "85%,50%"}, direction: LEFT, duration: 400, waitToSettleTimeoutMs: 100}
- tapOn: {text: "本卷插图 8，点击放大", waitToSettleTimeoutMs: 100}
- assertVisible: "关闭插图"
- takeScreenshot: build/android-ui/reader-gallery-zoom
- tapOn: {text: "关闭插图", waitToSettleTimeoutMs: 100}
- tapOn: {text: "隐藏插图栏", waitToSettleTimeoutMs: 100}
- assertNotVisible: "本卷插图 1，点击放大"
- tapOn:
    point: "50%,50%"
    text: "添加书签"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "取消"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "书签"
    waitToSettleTimeoutMs: 100
- assertVisible: "还没有书签"
- back
- tapOn:
    point: "50%,50%"
    text: "添加书签"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "备注（可留空）"
    waitToSettleTimeoutMs: 100
- inputText: "Bookmark1"
- hideKeyboard
- tapOn:
    point: "50%,50%"
    text: "保存"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "书签"
    waitToSettleTimeoutMs: 100
- assertVisible: "(?s).*Bookmark1.*"
- tapOn:
    point: "50%,50%"
    text: "删除书签"
    waitToSettleTimeoutMs: 100
- assertVisible: "还没有书签"
- back
- tapOn:
    point: "50%,50%"
    text: "添加书签"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "备注（可留空）"
    waitToSettleTimeoutMs: 100
- inputText: "LeftMargin"
- hideKeyboard
- tapOn:
    point: "50%,50%"
    text: "保存"
    waitToSettleTimeoutMs: 100
- tapOn:
    waitToSettleTimeoutMs: 100
    point: "50%,50%"
- swipe:
    start: "98%,80%"
    end: "98%,30%"
    duration: 600
- tapOn:
    waitToSettleTimeoutMs: 100
    point: "50%,50%"
- tapOn:
    point: "50%,50%"
    text: "添加书签"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "备注（可留空）"
    waitToSettleTimeoutMs: 100
- inputText: "RightMargin"
- hideKeyboard
- tapOn:
    point: "50%,50%"
    text: "保存"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "阅读设置"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "护眼"
    waitToSettleTimeoutMs: 100
- scrollUntilVisible:
    element: "左右翻页"
    direction: DOWN
- tapOn:
    point: "50%,50%"
    text: "左右翻页"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "滚动"
    waitToSettleTimeoutMs: 100
- scrollUntilVisible:
    element: "系统字体"
    direction: DOWN
- tapOn:
    point: "50%,50%"
    text: "系统字体"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "衬线字体"
    waitToSettleTimeoutMs: 100
- scrollUntilVisible:
    element: "跟随系统"
    direction: DOWN
- tapOn:
    point: "50%,50%"
    text: "跟随系统"
    waitToSettleTimeoutMs: 100
- takeScreenshot: build/android-ui/reader-settings
- back
- tapOn:
    point: "50%,50%"
    text: "目录"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "(?s).*Chapter 2.*"
    waitToSettleTimeoutMs: 100
- assertVisible: ".*Chapter 2 opening.*"
- takeScreenshot: build/android-ui/reader-chapter-two
- tapOn:
    point: "50%,50%"
    text: "阅读进度"
    waitToSettleTimeoutMs: 100
- assertVisible: "阅读进度"
- back
- tapOn:
    point: "50%,50%"
    text: "加入书架"
    waitToSettleTimeoutMs: 100
- assertVisible: "已在书架"
- back
- back
- tapOn:
    point: "50%,50%"
    text: "(?s).*追番.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "(?s).*书架.*"
    waitToSettleTimeoutMs: 100
- assertVisible: "(?s).*葬送的芙莉莲.*"
- takeScreenshot: build/android-ui/bookshelf-added
- tapOn:
    text: "小说操作"
    waitToSettleTimeoutMs: 100
- tapOn:
    text: "删除书籍"
    waitToSettleTimeoutMs: 100
- assertVisible: "删除书籍"
- tapOn:
    text: "取消"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "(?s).*葬送的芙莉莲.*"
    waitToSettleTimeoutMs: 100
- assertVisible: ".*Chapter 2 opening.*"
- takeScreenshot: build/android-ui/reader-resumed
