appId: com.zgcc.kazumisbook
---
- runFlow: set-layout.yaml
- tapOn: "(?s).*阅读进度有冲突.*"
- assertVisible: "选择要保留的阅读进度"
- tapOn: "(?s).*remote-ui-device.*"
- assertNotVisible: "选择要保留的阅读进度"
- assertNotVisible: "(?s).*阅读进度有冲突.*"
- tapOn: "(?s).*葬送的芙莉莲.*"
- extendedWaitUntil:
    visible: ".*Chapter 3 opening.*"
    timeout: 30000
- takeScreenshot: build/android-ui/conflict-selected-chapter
- back
- tapOn: "同步小说"
- extendedWaitUntil:
    visible:
      text: "同步小说"
      enabled: true
    timeout: 60000
- takeScreenshot: build/android-ui/conflict-final-sync
