appId: com.zgcc.kazumisbook
---
- launchApp
- extendedWaitUntil:
    visible: "热门番组"
    timeout: 10000
- tapOn:
    point: "50%,50%"
    text: "(?s).*我的.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "设置"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "(?s).*播放设置.*"
    waitToSettleTimeoutMs: 100
- scrollUntilVisible:
    element: "(?s).*视频渲染器.*"
    direction: DOWN
- tapOn:
    point: "50%,50%"
    text: "(?s).*视频渲染器.*"
    waitToSettleTimeoutMs: 100
- tapOn:
    point: "50%,50%"
    text: "(?s).*基于 OpenGL, 通用和稳健的选项.*"
    waitToSettleTimeoutMs: 100
- takeScreenshot: build/media-diagnostic/gpu-settings
