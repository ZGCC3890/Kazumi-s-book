appId: com.zgcc.kazumisbook
env:
  REQUIRE_PROGRESS: "true"
---
- launchApp
- extendedWaitUntil:
    visible: "热门番组"
    timeout: 60000
- tapOn: "(?s).*我的.*"
- tapOn: "历史记录"
- assertVisible: "(?s).*葬送的芙莉莲.*"
- tapOn: "继续播放"
- extendedWaitUntil:
    notVisible: "视频资源解析中"
    timeout: 30000
- runFlow:
    when:
      notVisible: "暂停"
    commands:
      - tapOn:
          point: "50%,25%"
- extendedWaitUntil:
    visible: "暂停"
    timeout: 30000
- runFlow:
    when:
      true: ${REQUIRE_PROGRESS == 'true'}
    commands:
      - extendedWaitUntil:
          visible: "(?s).*(?:00:(?:0[1-9]|[1-5][0-9])|01:[0-5][0-9]) / 02:00.*"
          timeout: 30000
