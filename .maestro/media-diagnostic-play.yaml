appId: com.zgcc.kazumisbook
env:
  REQUIRE_PROGRESS: "true"
---
- launchApp
- extendedWaitUntil:
    visible: "热门番组"
    timeout: 60000
- tapOn: "搜索"
- tapOn: "搜索番剧名称"
- inputText: "Frieren"
- tapOn: "搜索"
- extendedWaitUntil:
    visible: "(?s).*芙莉莲.*"
    timeout: 60000
- tapOn:
    text: "(?s).*芙莉莲.*"
    index: 0
- extendedWaitUntil:
    visible: "开始观看"
    timeout: 60000
- tapOn: "开始观看"
- extendedWaitUntil:
    visible: "(?s).*Fixture Video.*"
    timeout: 30000
- tapOn:
    text: "(?s).*葬送的芙莉莲.*"
    index: 0
- extendedWaitUntil:
    notVisible: "视频资源解析中"
    timeout: 30000
- runFlow:
    when:
      notVisible: "暂停"
    commands:
      - tapOn:
          point: "50%,25%"
- extendedWaitUntil:
    visible: "暂停"
    timeout: 30000
- runFlow:
    when:
      true: ${REQUIRE_PROGRESS == 'true'}
    commands:
      - extendedWaitUntil:
          visible: "(?s).*00:(0[1-9]|1[0-9]) / 00:20.*"
          timeout: 30000
