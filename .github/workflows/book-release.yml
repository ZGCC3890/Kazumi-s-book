name: Publish Kazumi's book

on:
  push:
    tags: ['0.*']

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the successful build for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "from pathlib import Path; import re; print(re.search(r'^version: ([^+]+)', Path('pubspec.yaml').read_text(), re.M)[1])")
          test "$version" = "$GITHUB_REF_NAME"
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow book-ci.yml --branch feature/novel-reader --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$run_id"
          test "$run_id" != null
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name Kazumis-book-Android-development --dir release/android
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name Kazumis-book-Windows-development --dir release/windows
          mv release/android/app-release.apk "release/Kazumis-book-Android-${GITHUB_REF_NAME}.apk"
          mv release/windows/Kazumis_book_windows.zip "release/Kazumis-book-Windows-${GITHUB_REF_NAME}.zip"
          cd release
          sha256sum *.apk *.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.apk *.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --verify-tag --title "Kazumi's book $GITHUB_REF_NAME" --notes-file ../CHANGELOG.md
