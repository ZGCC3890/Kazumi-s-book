name: Temporary Android renderer diagnostic

on:
  push:
    branches: [ci/android-media-diagnostic]

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Kazumis-book-Android-ui-test
          run-id: 39029285891
          github-token: ${{ github.token }}
          path: diagnostic-apk
      - uses: actions/download-artifact@v4
        with:
          name: Android-UI-phone
          run-id: 39029285891
          github-token: ${{ github.token }}
          path: diagnostic-prior
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the existing pinned UI runner
        run: |
          curl --fail --location --silent --show-error https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip --output "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_CLI_NO_ANALYTICS: 'true'
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-build: 16428233
          disable-animations: true
          script: bash tool/android_ui/media-diagnostic.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-renderer-diagnostic
          path: |
            build/media-diagnostic/
            ~/.maestro/tests/
