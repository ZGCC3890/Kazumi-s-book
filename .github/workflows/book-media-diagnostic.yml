name: Android application and playback validation

on:
  push:
    branches: [ci/android-media-diagnostic, ci/android-ui-validation]

permissions:
  contents: read
  actions: read

jobs:
  compare:
    if: github.ref == 'refs/heads/ci/android-media-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: [swiftshader]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Kazumis-book-Android-ui-test
          run-id: 39029285891
          github-token: ${{ github.token }}
          path: diagnostic-apk
      - uses: actions/download-artifact@v4
        with:
          name: Android-UI-phone
          run-id: 39029285891
          github-token: ${{ github.token }}
          path: diagnostic-prior
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the existing pinned UI runner
        run: |
          mkdir -p build/media-diagnostic
          sudo apt-get update -qq > build/media-diagnostic/packages.log 2>&1
          sudo apt-get install -y -qq ffmpeg >> build/media-diagnostic/packages.log 2>&1
          curl --fail --location --silent --show-error https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip --output "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_CLI_NO_ANALYTICS: 'true'
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-build: 16428233
          emulator-options: -no-window -gpu ${{ matrix.backend }} -feature -HardwareDecoder -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tool/android_ui/media-diagnostic.sh ${{ matrix.backend }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-renderer-${{ matrix.backend }}
          path: |
            build/media-diagnostic/
            ~/.maestro/tests/
  full_operations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        layout: [phone, tablet]
    steps:
      - uses: actions/checkout@v4
      - name: Verify the existing APK matches application sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_commit=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39074039751" --jq .head_sha)
          git fetch --no-tags --depth=1 origin "$source_commit"
          git diff --exit-code --quiet "$source_commit" HEAD -- . ':(exclude).maestro/**' ':(exclude).github/workflows/book-media-diagnostic.yml' ':(exclude)test/novel_rules_page_test.dart'
      - uses: actions/download-artifact@v4
        with:
          name: Kazumis-book-Android-ui-test
          run-id: 39074039751
          github-token: ${{ github.token }}
          path: android-ui-apk
      - uses: actions/download-artifact@v4
        with:
          name: Kazumis-book-Android-upgrade-baseline
          run-id: 39074039751
          github-token: ${{ github.token }}
          path: android-upgrade-apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the pinned native UI runner
        run: |
          mkdir -p build/android-ui
          sudo apt-get update -qq > build/android-ui/packages.log 2>&1
          sudo apt-get install -y -qq ffmpeg >> build/android-ui/packages.log 2>&1
          curl --fail --location --silent --show-error https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip --output "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_CLI_NO_ANALYTICS: 'true'
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-build: 16428233
          emulator-options: -no-window -gpu swiftshader -feature -HardwareDecoder -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tool/android_ui/run.sh ${{ matrix.layout }} full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-full-${{ matrix.layout }}
          path: |
            build/android-ui/
            ~/.maestro/tests/
