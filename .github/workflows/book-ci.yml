name: Kazumi's book checks, builds and releases

on:
  push:
    branches: [feature/novel-reader]
  workflow_dispatch:

permissions:
  contents: read

env:
  DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
  DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev libasound2-dev libssl-dev ffmpeg
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --fatal-warnings
      - name: Run complete Flutter regression suite
        timeout-minutes: 5
        run: flutter test
      - name: Verify live upstream anime search and comments
        run: flutter test test/live/book_services_test.dart --dart-define=BOOK_LIVE=true --reporter expanded
      - name: Generate owned native video fixture
        run: |
          mkdir -p build/native-fixture
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=24 -f lavfi -i sine=frequency=440 -t 120 -c:v libx264 -threads 1 -pix_fmt yuv420p -c:a aac -movflags +faststart build/native-fixture/clip.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: Owned-native-video-fixture
          path: build/native-fixture/clip.mp4
  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - uses: actions/download-artifact@v4
        with:
          name: Owned-native-video-fixture
          path: build/windows-ui/fixtures
      - name: Native Windows application operations
        shell: pwsh
        timeout-minutes: 25
        run: |
          New-Item -ItemType Directory -Path build/windows-ui -Force | Out-Null
          $fixture = Start-Process python -ArgumentList @('tool/android_ui/fixture_server.py', '--output', 'build/windows-ui/fixtures', '--base-url', 'http://127.0.0.1:8765') -WindowStyle Hidden -PassThru -RedirectStandardOutput build/windows-ui/fixture.log -RedirectStandardError build/windows-ui/fixture-error.log
          try {
            flutter test integration_test/windows_book_operations_test.dart -d windows --reporter expanded *> build/windows-ui/test.log
            $result = $LASTEXITCODE
            Get-Content -LiteralPath build/windows-ui/test.log -Tail 45
            if ($result -ne 0) { throw 'Native Windows operation flow failed.' }
          } finally {
            Stop-Process -Id $fixture.Id -ErrorAction SilentlyContinue
          }
      - name: Retain native application log on an operation failure
        if: failure()
        shell: pwsh
        run: |
          $applicationLog = Join-Path $env:APPDATA "ZGCC3890/Kazumi's book/logs/kazumi_logs.log"
          if (Test-Path -LiteralPath $applicationLog -PathType Leaf) {
            New-Item -ItemType Directory -Path build/windows-ui -Force | Out-Null
            Copy-Item -LiteralPath $applicationLog -Destination build/windows-ui/application.log
          }
      - name: Clear only the isolated native test profile
        if: always()
        shell: pwsh
        run: ./tool/windows_ui/clean_test_profile.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-UI
          path: build/windows-ui/
      - run: flutter build windows --release "--dart-define=DANDANAPI_APPID=$env:DANDANAPI_APPID" "--dart-define=DANDANAPI_KEY=$env:DANDANAPI_KEY"
      - name: Verify Windows identity and native startup
        shell: pwsh
        run: |
          $executable = (Resolve-Path 'build/windows/x64/runner/Release/kazumis_book.exe').Path
          $versionInfo = (Get-Item -LiteralPath $executable).VersionInfo
          if ($versionInfo.ProductName -ne "Kazumi's book" -or $versionInfo.CompanyName -ne 'ZGCC3890') {
            throw 'Unexpected Windows product identity.'
          }
          $bookProcess = Start-Process -FilePath $executable -WorkingDirectory (Split-Path $executable) -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 15
            $bookProcess.Refresh()
            if ($bookProcess.HasExited) { throw "Native startup exited: $($bookProcess.ExitCode)" }
            $dataDirectory = Join-Path $env:APPDATA "ZGCC3890/Kazumi's book/hive"
            if (!(Test-Path -LiteralPath (Join-Path $dataDirectory 'setting.hive'))) {
              throw 'Independent application settings directory was not initialized.'
            }
            Write-Output 'Native process started and created its independent settings directory.'
          } finally {
            if (!$bookProcess.HasExited) { Stop-Process -Id $bookProcess.Id }
          }
      - shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Kazumis_book_windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Kazumis-book-Windows-development
          path: Kazumis_book_windows.zip
  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - name: Load private Android signing key
        env:
          BOOK_ANDROID_SIGNING: ${{ secrets.BOOK_ANDROID_SIGNING }}
        run: |
          python3 - <<'PY'
          import os, json, base64
          key = json.loads(os.environ['BOOK_ANDROID_SIGNING'])
          print('::add-mask::' + key['password'])
          with open('android/app/book-release.p12', 'xb') as output:
              output.write(base64.b64decode(key['keystore'], validate=True))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('BOOK_KEYSTORE_PASSWORD=' + key['password'] + '\n')
          PY
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64 "--dart-define=DANDANAPI_APPID=$DANDANAPI_APPID" "--dart-define=DANDANAPI_KEY=$DANDANAPI_KEY"
      - uses: actions/cache@v4
        id: upgrade-baseline
        with:
          path: build/upgrade-baseline/app-x86_64-release.apk
          key: book-upgrade-cd6b741fabec4fe0f97a2a5291ddbbda51769d65-fixed-certificate-x64
      - name: Build the signed 0.1.1 source baseline for upgrade operations
        if: steps.upgrade-baseline.outputs.cache-hit != 'true'
        shell: bash
        run: |
          baseline="$RUNNER_TEMP/book-upgrade-baseline"
          git fetch --no-tags origin tag 0.1.1
          test "$(git rev-parse '0.1.1^{commit}')" = cd6b741fabec4fe0f97a2a5291ddbbda51769d65
          git worktree add --detach "$baseline" 0.1.1
          cp android/app/book-release.p12 "$baseline/android/app/book-release.p12"
          mkdir -p build/upgrade-baseline
          baseline_log="$GITHUB_WORKSPACE/build/upgrade-baseline/build.log"
          (
            cd "$baseline"
            flutter pub get
            flutter build apk --release --split-per-abi --target-platform android-x64
          ) > "$baseline_log" 2>&1 || { tail -n 50 "$baseline_log"; exit 1; }
          cp "$baseline/build/app/outputs/flutter-apk/app-x86_64-release.apk" build/upgrade-baseline/
      - run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-release.apk
      - name: Verify independent Android application ID
        shell: bash
        run: |
          aapt_tools=("$ANDROID_HOME"/build-tools/*/aapt)
          metadata=$("${aapt_tools[0]}" dump badging build/app/outputs/flutter-apk/app-release.apk)
          if [[ "$metadata" != *"package: name='com.zgcc.kazumisbook'"* ]]; then
            echo 'Unexpected Android application ID.'
            exit 1
          fi
          echo 'Verified com.zgcc.kazumisbook in the compiled APK.'
          signing_tools=("$ANDROID_HOME"/build-tools/*/apksigner)
          signature=$("${signing_tools[0]}" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          if [[ "$signature" != *'85fa5bfda7fd385f44cabf8da36970bcde6c049e297f4dc67ca3e24252e4ee41'* ]]; then
            echo 'Unexpected Android signing certificate.'
            exit 1
          fi
          echo 'Verified the fixed Kazumis book release signing certificate.'
          baseline_metadata=$("${aapt_tools[0]}" dump badging build/upgrade-baseline/app-x86_64-release.apk)
          [[ "$baseline_metadata" == *"package: name='com.zgcc.kazumisbook' versionCode='24' versionName='0.1.1'"* ]]
          baseline_signature=$("${signing_tools[0]}" verify --print-certs build/upgrade-baseline/app-x86_64-release.apk)
          [[ "$baseline_signature" == *'85fa5bfda7fd385f44cabf8da36970bcde6c049e297f4dc67ca3e24252e4ee41'* ]]
      - uses: actions/upload-artifact@v4
        with:
          name: Kazumis-book-Android-development
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kazumis-book-Android-ui-test
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kazumis-book-Android-upgrade-baseline
          path: build/upgrade-baseline/app-x86_64-release.apk
  android_ui:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        layout: [phone, tablet]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Kazumis-book-Android-ui-test
          path: android-ui-apk
      - uses: actions/download-artifact@v4
        with:
          name: Kazumis-book-Android-upgrade-baseline
          path: android-upgrade-apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android UI test runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          curl --fail --location --silent --show-error https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip --output "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          test -f "$RUNNER_TEMP/maestro/maestro/bin/maestro"
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_CLI_NO_ANALYTICS: 'true'
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-build: 16428233
          emulator-options: -no-window -gpu swiftshader -feature -HardwareDecoder -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tool/android_ui/run.sh ${{ matrix.layout }} full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-UI-${{ matrix.layout }}
          path: |
            build/android-ui/
            ~/.maestro/tests/
