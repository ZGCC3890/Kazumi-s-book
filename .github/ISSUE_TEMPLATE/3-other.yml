name: 我有其它内容
description: 上面的模板我都用不到！
body:
  - type: markdown
    attributes:
      value: |
        请填写以下内容，以方便我们了解你的目的。
        填写前，请搜索[本仓库 Issues](https://github.com/ZGCC3890/Kazumi-s-book/issues)并查阅 README；不要附带账号凭据或私人数据。

  - type: textarea
    id: content
    attributes:
      label: 填写内容
      description: 你想说些什么呢？
    validations:
      required: true

  - type: checkboxes
    id: validations
    attributes:
      label: 提交前确认
      options:
        - label: 我已经查看了[本仓库 Issues](https://github.com/ZGCC3890/Kazumi-s-book/issues)，没有发现重复问题。
          required: true
        - label: 我已说明问题背景，并确认附件不含敏感信息。
          required: true
