name: 期待新功能
description: 为 Kazumi's book 提出功能建议。
title: '[feat]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        请填写以下内容，以方便我们讨论该功能的用途。
        填写前，请搜索[本仓库 Issues](https://github.com/ZGCC3890/Kazumi-s-book/issues)及版本说明，说明使用场景、当前不足和预期行为。

  - type: textarea
    id: reason
    attributes:
      label: 提出原因
      description: 为什么你想添加一个新功能？现在的哪个功能你不满意，还是这个功能目前并不存在？
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你的想法
      description: 你需要什么样的新功能？它有什么作用？它应该是如何工作的？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 可供参考的内容
      description: |
        有没有某个应用已经实现了你想要的功能？那看起来是什么样的？
        提供截图可以更好地展示功能。

  - type: checkboxes
    id: validations
    attributes:
      label: 提交前确认
      options:
        - label: 我已经查看了[本仓库 Issues](https://github.com/ZGCC3890/Kazumi-s-book/issues)，没有发现重复建议。
          required: true
        - label: 我知道一个新功能需要进行讨论并考虑是否添加，并不是一定会被接受。
          required: true
        - label: 我已查阅当前版本说明，该需求尚未提供。
          required: true
